<script>

//

  ink: "#0D0E13",
  paper: "#F5F2EB",
  cyan: "#14C8E8",
  red: "#FF3D5E",
});

  r: 132, // daire yarıçapı
  d: 120, // son düzende merkezler arası

  if (tau <= 0 || tau >= life) return 0;

// Yerel splash uygulamanın temasını okuyamaz (tema JS deposunda), bu yüzden sahne

const ANGLE_STEPS = 2000;
